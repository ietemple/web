# Desplega templeobert.cat a GitHub Pages.
#
# Publica tres coses alhora:
#   /          -> aquest repositori (Temple Obert, HTML estatic pur)
#   /bio-geo-3r    -> build del repositori <propietari>/bioigeo3r
#   /bio-geo-4t    -> build del repositori <propietari>/bioigeo4t
#
# <propietari> es, per defecte, el mateix compte o organitzacio que allotja
# aquest repositori. Si els portals de bio viuen en un altre compte, defineix
# la variable de repositori PORTALS_OWNER (Settings > Secrets and variables >
# Actions > Variables) amb aquell nom d'usuari o organitzacio. Aixi els tres
# repositoris no han de compartir propietari i no cal transferir res.
#
# Els dos portals de bio segueixen tenint el SEU propi desplegament als seus
# repositoris. Aixo nomes els col.loca, a mes, sota el domini comu. Si aquest
# workflow falla, els tres llocs segueixen vius a les seves URL de sempre.

name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  # Els repositoris de bio criden aquest event quan publiquen contingut nou.
  # NOMES funciona si hi ha el secret DISPATCH_TEMPLEOBERT al repo de bio
  # corresponent (vegeu el seu deploy.yml); si no hi es, el pas hi calla i
  # aquest event mai arriba. Per aixo hi ha tambe el "schedule" de sota, que
  # no en depen.
  repository_dispatch:
    types: [portal-actualitzat]
  # Xarxa de seguretat: encara que el repository_dispatch no arribi (secret
  # no configurat, token caducat...), aquest lloc no pot quedar-se penjat amb
  # fitxes velles en silenci. Es reconstrueix sol amb el darrer main de
  # bioigeo3r/bioigeo4t unes quantes vegades al dia. Horari en UTC: 8/12/18h
  # (~10/14/20h a l'estiu, 9/13/19h a l'hivern), per cobrir la publicacio
  # automatica del mati (9:45 hora local) i les sessions de tarda/vespre.
  schedule:
    - cron: '0 8,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # 1. Temple Obert, a l'arrel
      # ---------------------------------------------------------------
      - name: Descarregar Temple Obert
        uses: actions/checkout@v4

      - name: Copiar Temple Obert a l'arrel de publicacio
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_historic' \
            --exclude='_site' \
            --exclude='.src' \
            --exclude='*.md' \
            --exclude='LICENSE*' \
            ./ _site/
          test -f _site/index.html
          test -f _site/cami-circular.html
          test -f _site/CNAME

      # El domini propi nomes s'aplica quan la variable de repositori
      # DOMINI_ACTIU val "1". Mentre no hi sigui, el lloc es publica a la URL
      # de github.io i s'hi pot verificar sense tocar el DNS. Vegeu el README.
      - name: Aplicar el domini propi nomes si toca
        run: |
          if [ "${{ vars.DOMINI_ACTIU }}" = "1" ]; then
            echo "Domini propi actiu: $(cat _site/CNAME)"
          else
            rm -f _site/CNAME
            echo "Domini propi desactivat; es publica a la URL de github.io."
          fi

      # ---------------------------------------------------------------
      # 2. Portals de bio
      # ---------------------------------------------------------------
      - name: Descarregar Bio i Geo 3r
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PORTALS_OWNER || github.repository_owner }}/bioigeo3r
          path: .src/bio-geo-3r

      - name: Descarregar Bio i Geo 4t
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PORTALS_OWNER || github.repository_owner }}/bioigeo4t
          path: .src/bio-geo-4t

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            .src/bio-geo-3r/package-lock.json
            .src/bio-geo-4t/package-lock.json

      - name: Construir Bio i Geo 3r
        working-directory: .src/bio-geo-3r
        run: npm ci && npm run build

      - name: Construir Bio i Geo 4t
        working-directory: .src/bio-geo-4t
        run: npm ci && npm run build

      - name: Col.locar els portals sota /bio-geo-3r i /bio-geo-4t
        run: |
          mkdir -p _site/bio-geo-3r _site/bio-geo-4t
          cp -r .src/bio-geo-3r/dist/. _site/bio-geo-3r/
          cp -r .src/bio-geo-4t/dist/. _site/bio-geo-4t/
          test -f _site/bio-geo-3r/index.html
          test -f _site/bio-geo-4t/index.html

      # ---------------------------------------------------------------
      # 3. Publicar
      # ---------------------------------------------------------------
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
